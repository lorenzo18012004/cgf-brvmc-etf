name: iNAV BRVMC (heures de marche)

on:
  schedule:
    - cron: '30 9 * * 1-5'
    - cron: '40 9 * * 1-5'
    - cron: '50 9 * * 1-5'
    - cron: '0,10,20,30,40,50 10 * * 1-5'
    - cron: '0,10,20,30,40,50 11 * * 1-5'
    - cron: '0,10,20,30,40,50 12 * * 1-5'
    - cron: '0,10,20,30,40,50 13 * * 1-5'
    - cron: '0,10,20,30,40,50 14 * * 1-5'
    - cron: '0,10,20,30 15 * * 1-5'
  workflow_dispatch:

concurrency:
  group: inav-loop
  cancel-in-progress: false

jobs:
  inav:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Verifier heures de marche
        id: check_hours
        run: |
          python3 -c "
          import os
          from datetime import datetime, timezone, time as dtime
          now = datetime.now(timezone.utc)
          t = now.time().replace(tzinfo=None)
          is_open = now.weekday() < 5 and dtime(9,30) <= t <= dtime(15,30)
          val = 'true' if is_open else 'false'
          print(f'market_open={val}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'market_open={val}\n')
          "

      - name: Attendre 5 minutes
        if: steps.check_hours.outputs.market_open == 'true'
        run: sleep 300

      - name: Setup Python 3.11
        if: steps.check_hours.outputs.market_open == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/requirements_cloud.txt

      - name: Installer dependances
        if: steps.check_hours.outputs.market_open == 'true'
        run: pip install -r requirements/requirements_cloud.txt

      - name: Détection actions corporatives (1er snapshot du jour)
        if: steps.check_hours.outputs.market_open == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 -c "
          import json, os
          from datetime import date, datetime, timezone

          today = date.today().isoformat()
          hist_path = 'data/nav_intraday_history.json'

          # Lancer le check uniquement si aucun snapshot aujourd'hui
          already_done = False
          if os.path.exists(hist_path):
              hist = json.load(open(hist_path, encoding='utf-8'))
              already_done = bool(hist.get(today))

          if already_done:
              print(f'[{today}] Snapshots deja presents — check actions corpo ignore.')
          else:
              print(f'[{today}] Premier snapshot du jour — lancement check actions corporatives.')
              import subprocess
              result = subprocess.run(['python', 'scripts/check_corporate_actions.py'], capture_output=True, text=True)
              print(result.stdout)
              if result.returncode != 0:
                  print(result.stderr)
          "

      - name: Calculer iNAV
        if: steps.check_hours.outputs.market_open == 'true'
        run: python scripts/scrape_intraday_cloud.py

      - name: Mettre a jour NAV quotidienne
        if: steps.check_hours.outputs.market_open == 'true'
        run: python scripts/calc_nav_cloud.py

      - name: Commit et push donnees iNAV
        if: steps.check_hours.outputs.market_open == 'true'
        run: |
          git config user.name "cgf-bot"
          git config user.email "bot@cgf-bourse.ci"
          git add data/intraday_nav.json data/nav_intraday_history.json data/launch_state.json data/nav_latest.json
          git diff --staged --quiet || git commit -m "iNAV BRVMC: snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main && git push || echo "[WARN] Push echoue"

      - name: Relancer boucle iNAV (workflow_dispatch)
        if: steps.check_hours.outputs.market_open == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BOUCLE=$(python3 -c "
          from datetime import datetime, timezone, time as dtime
          now = datetime.now(timezone.utc)
          t = now.time().replace(tzinfo=None)
          print('true' if now.weekday() < 5 and dtime(9,30) <= t < dtime(15,20) else 'false')
          ")
          if [ "$BOUCLE" = "true" ]; then
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/intraday.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "[BOUCLE] workflow_dispatch declenche — HTTP $HTTP"
          else
            echo "[FIN] Hors heures de marche — boucle arretee"
          fi
