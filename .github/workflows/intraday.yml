name: iNAV BRVMC (heures de marche)

on:
  schedule:
    - cron: '30 9 * * 1-5'
    - cron: '40 9 * * 1-5'
    - cron: '50 9 * * 1-5'
    - cron: '0,10,20,30,40,50 10 * * 1-5'
    - cron: '0,10,20,30,40,50 11 * * 1-5'
    - cron: '0,10,20,30,40,50 12 * * 1-5'
    - cron: '0,10,20,30,40,50 13 * * 1-5'
    - cron: '0,10,20,30,40,50 14 * * 1-5'
    - cron: '0,10,20,30 15 * * 1-5'
  workflow_dispatch:

concurrency:
  group: inav-loop
  cancel-in-progress: false

jobs:
  inav:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Verifier heures de marche
        id: check_hours
        run: |
          MARKET_OPEN=$(python3 -c "
          from datetime import datetime, timezone, time as dtime
          now = datetime.now(timezone.utc)
          t = now.time().replace(tzinfo=None)
          print('true' if now.weekday() < 5 and dtime(9,30) <= t <= dtime(15,30) else 'false')
          ")
          echo "market_open=$MARKET_OPEN" >> $GITHUB_OUTPUT

      - name: Attendre 5 minutes
        if: steps.check_hours.outputs.market_open == 'true'
        run: sleep 300

      - name: Setup Python 3.11
        if: steps.check_hours.outputs.market_open == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/requirements_cloud.txt

      - name: Installer dependances
        if: steps.check_hours.outputs.market_open == 'true'
        run: pip install -r requirements/requirements_cloud.txt

      - name: Detection actions corporatives (1er snapshot du jour)
        if: steps.check_hours.outputs.market_open == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 -c "
          import json, os
          from datetime import date
          today = date.today().isoformat()
          hist_path = 'data/nav_intraday_history.json'
          already_done = os.path.exists(hist_path) and bool(json.load(open(hist_path)).get(today))
          if already_done:
              print('[' + today + '] Snapshots deja presents.')
          else:
              import subprocess
              r = subprocess.run(['python', 'scripts/check_corporate_actions.py'], capture_output=True, text=True)
              print(r.stdout)
          "

      - name: Calculer iNAV
        if: steps.check_hours.outputs.market_open == 'true'
        run: python scripts/scrape_intraday_cloud.py

      - name: Mettre a jour NAV quotidienne
        if: steps.check_hours.outputs.market_open == 'true'
        run: python scripts/calc_nav_cloud.py

      - name: Commit et push
        if: steps.check_hours.outputs.market_open == 'true'
        run: |
          git config user.name "cgf-bot"
          git config user.email "bot@cgf-bourse.ci"
          git add data/intraday_nav.json data/nav_intraday_history.json data/launch_state.json data/nav_latest.json
          git diff --staged --quiet || git commit -m "iNAV BRVMC: snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main && git push || true
