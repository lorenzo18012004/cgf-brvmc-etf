name: Appliquer Rebalancement (validation manuelle requise)

on:
  workflow_dispatch:
    inputs:
      confirmer:
        description: 'Tapez CONFIRMER pour appliquer la proposition en attente'
        required: true
        default: ''

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Vérification confirmation
        run: |
          if [ "${{ github.event.inputs.confirmer }}" != "CONFIRMER" ]; then
            echo "ERREUR : Tapez CONFIRMER dans le champ. Aucun fichier modifié."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/requirements_cloud.txt

      - name: Installer dépendances
        run: pip install -r requirements/requirements_cloud.txt

      - name: Appliquer la proposition en attente (rebal_pending.json)
        run: python scripts/apply_rebalancing.py

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "rebal: application rebalancement $(date -u +'%Y-%m-%d')"
          file_pattern: |
            data/rebal_detail.json
            data/rebal_pending.json
            data/nav_latest.json
          commit_user_name: cgf-bot
          commit_user_email: bot@cgf-bourse.ci
