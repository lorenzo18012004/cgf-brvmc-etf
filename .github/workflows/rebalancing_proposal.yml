name: Proposition Rebalancement BRVM30

on:
  schedule:
    # Chaque jour du 28 au 3 du mois suivant à 08h00 UTC
    # Couvre la fenêtre de publication des avis BRVM30 (rebalancements trimestriels)
    - cron: '0 8,12 28-31 * *'
    - cron: '0 8,12 1-3 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forcer la proposition même si déjà proposée'
        required: false
        default: false
        type: boolean

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/requirements_cloud.txt

      - name: Installer dépendances système (OCR)
        run: sudo apt-get install -y tesseract-ocr tesseract-ocr-fra --quiet

      - name: Installer dépendances Python
        run: pip install -r requirements/requirements_cloud.txt

      - name: Vérifier nouveau PDF composition BRVM30
        id: fetch_pdf
        run: |
          python scripts/fetch_brvm_composition_pdf.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Vérifier nouvelle composition BRVM30
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scripts/propose_rebalancing.py --force
          else
            python scripts/propose_rebalancing.py
          fi

      - name: Sauvegarder (si nouvelle composition ou proposition)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "rebal: nouvelle composition BRVM30 détectée $(date -u +'%Y-%m-%d')"
          file_pattern: |
            data/brvm_composition_latest.json
            data/brvm_composition_history.json
            data/rebal_pending.json
          commit_user_name: cgf-bot
          commit_user_email: bot@cgf-bourse.ci
